services:
  feed:
    build: .
    env_file:
      - .env
    ports:
      - "8090:8000"         # 8000 на машине занят другими процессами
    volumes:
      - feed-data:/data     # только база; код остаётся в образе
    environment:
      LOG: "${LENTELE_LOG:-0}"   # 1 — включить логи запросов
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"  # 1 — сайт работает за HTTPS
    # Без этого зависший процесс выглядит работающим: docker не знает, что
    # сервер перестал отвечать, и перезапускает его только при падении процесса.
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # С включённым LOG журнал растёт на megabytes в день и без ограничения
    # забивает диск Docker. Ротация: пять файлов по десять мегабайт.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  feed-data:
