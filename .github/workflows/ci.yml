name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Интерфейс собирается: без сборки тесты и образ не видят того, что
      # увидит человек. Ки�� Monos ставится из репозитория, версия зафиксирована
      # в ui/package.json.
      - name: Зависимости интерфейса
        working-directory: ui
        run: npm ci

      - name: Интерфейс собирается
        working-directory: ui
        run: npm run build

      # Статическая проверка: ловит ссылку на несуществующую переменную, а
      # та роняет приложение при переходе между экранами — и до стенда.
      - name: Интерфейс без ошибок
        working-directory: ui
        run: npm run check

      - name: Тесты
        run: python3 -m unittest -v

      - name: Целостность интерфейса
        run: python3 check_ui.py

      # Сборка ловит главную поломку этого проекта: новый файл в репозитории
      # не попадает в образ, потому что Dockerfile копирует поимённо.
      - name: Образ собирается
        run: docker build -t koloda:ci .
